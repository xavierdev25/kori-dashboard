# Paquetes a los que NO se les deja ejecutar scripts de instalacion. Ambos
# compilan binarios nativos al instalarse y ninguno lo necesita aqui: usan
# binarios precompilados. Sin esta lista, pnpm corta la instalacion en CI con
# ERR_PNPM_IGNORED_BUILDS en vez de limitarse a avisar.
allowBuilds:
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Versiones forzadas para dependencias que `next` trae clavadas y no podemos
# subir de otra forma. Las tres son herramientas de compilacion —procesan CSS
# e imagenes al construir— y no llegan al navegador, pero un aviso de
# severidad alta que se queda ahi para siempre acaba enseñando a ignorar la
# auditoria entera, y entonces el dia que salga uno que si importa tampoco se
# mira.
overrides:
  postcss: ^8.5.18
  nanoid: ^3.3.18
  sharp: ^0.35.0
